[RP2040_FLASH]
build_flags =
  -D KNX_FLASH_OFFSET=0x300000
  -D KNX_FLASH_SIZE=0x10000
  -D OPENKNX_FLASH_OFFSET=0x310000
  -D OPENKNX_FLASH_SIZE=0x4000
  -D EXCHANGE_FLASH_OFFSET=0x314000
  -D EXCHANGE_FLASH_SIZE=0x100000
  -D EXCHANGE_FS_SIZE=0x01000000
  -D USE_BLOCK_DEVICE_INTERFACE
  -D OPENKNX_USB_MSC
;
; global custom
;
[custom]
build_flags =
  -D SERIAL_DEBUG=Serial
  -I lib/OGM-HardwareConfig/include/
  -fexceptions
  -D OPENKNX_PING
  -D OPENKNX_WEBSERVER
  -D OPENKNX_WEBCONSOLE


[develop]
extends = RP2040_develop, custom
build_flags =
  ${RP2040_develop.build_flags}
  ${custom.build_flags}
  ;-D OPENKNX_HEARTBEAT
   -D OPENKNX_HEARTBEAT_PRIO
  ; -D OPENKNX_RTT
  ; -D BUFFER_SIZE_UP=10240
  ; -D DEBUG_LOOP_TIME=10 ; will print a info when a loop took more than x ms.
  ; -D LOGIC_TRACE
  ; ; to see trace logs, they must match one of the 5 filters (TRACE_LOG1 .. TRACE_LOG2)
  ; "-D OPENKNX_TRACE1=Common.*"
  ; "-D OPENKNX_TRACE3=DummyChannel<1>"
  ; "-D OPENKNX_TRACE4=DummyChannel<[3-5]>"
  ;-D KNX_LOG_COUPLER
  ;-D KNX_LOG_IP
  ;-D KNX_LOG_TUNNELING
  -D KNX_IP_W5500
  -D OPENKNX_TIME_TESTCOMMAND
  -D OPENKNX_RUNTIME_STAT
  -D OPENKNX_RUNTIME_STAT_BUCKETN=10
  "-D OPENKNX_RUNTIME_STAT_BUCKETS=5000, 6000, 7000, 8000, 10000, 15000, 30000, 50000, 100000"


; this config block is for specifing options that are valid for all release builds
[releases]
extends = RP2040_releases, custom
build_flags =
  ${RP2040_releases.build_flags}
  ${custom.build_flags}
  -D KNX_IP_W5500




; ------ REG1-Eth------
[env:develop_REG1_ETH]
extends = develop
board_upload.maximum_size = 16777216
board_build.filesystem_size = 12496896
# monitor_port = /dev/cu.usbmodem2101
build_flags =
   ${KNX_TP.build_flags}
   ${develop.build_flags}
   -I lib/OGM-HardwareConfig/include/
   -D DEVICE_REG1_ETH
   -D KNX_IP_LAN
   # -D KNX_IP_GENERIC
  -D OPENKNX_INFOLED1_DEFAULT=0
  -D OPENKNX_INFOLED2_DEFAULT=10
  -D OPENKNX_INFOLED3_DEFAULT=400


[env:develop_REG1_ETH_USB]
extends = RP2040_UPLOAD_USB, env:develop_REG1_ETH

[env:develop_REG1_ETH_JLINK]
extends = UPLOAD_JLINK, env:develop_REG1_ETH

[env:beta_REG1_ETH_USB]
extends = RP2040_UPLOAD_USB, env:develop_REG1_ETH
build_flags =
   ${env:develop_REG1_ETH.build_flags}



;  Releases
[env:release_REG1_ETH]
extends = releases
board_upload.maximum_size = 16777216
board_build.filesystem_size = 12496896
build_flags =
   ${KNX_TP.build_flags}
   ${releases.build_flags}
  ; ${RP2040_EXCHANGE_16MB.build_flags}
  -I lib/OGM-HardwareConfig/include/
  -D DEVICE_REG1_ETH
  -D KNX_IP_LAN
  -D OPENKNX_INFOLED1_DEFAULT=0
  -D OPENKNX_INFOLED2_DEFAULT=10
  -D OPENKNX_INFOLED3_DEFAULT=400

; ESP32
[develop_ESP]
extends = custom, ESP32_develop
build_flags =
  ${custom.build_flags}
  ${ESP32_develop.build_flags}
  -D OPENKNX_HEARTBEAT
  -D OPENKNX_USB_EXCHANGE_IGNORE
  ;-D OPENKNX_FILE_TRANSFER_IGNORE
  -D OPENKNX_TIME_TESTCOMMAND
  -D NET_USE_NTP
  ; ; -D OPENKNX_HEARTBEAT_PRIO
  ; -D DEBUG_LOOP_TIME=10 ; will print a info when a loop took more than x ms.
  ; -D LOGIC_TRACE
  ; ; to see trace logs, they must match one of the 5 filters (TRACE_LOG1 .. TRACE_LOG2)
  "-D OPENKNX_TRACE1=IW.*"
  ;"-D OPENKNX_TRACE2=Logic.*"
  ;"-D OPENKNX_TRACE3=*.*"
  ; -D OPENKNX_RTT
  ; -D BUFFER_SIZE_UP=10240





[custom_ESP32]
extends = ESP32, custom
build_flags =
  #-D OPENKNX_RUNTIME_STAT
  ${BASE.build_flags}
  -D OPENKNX_DUALCORE
  -D USE_ESP_ASNC_WEB_SERVER
   # -D OPENKNX_WATCHDOG

  -std=gnu++17
 # build_flags = -std=gnu++17
  #-D AC_USE_LITTLEFS
  #-D PB_USE_LITTLEFS
  # -D USE_AUTO_CONNECT
  
build_unflags = -std=gnu++11
lib_ldf_mode = deep # deep+ and chain+ prevent finding WiFi.h for ESP32 builds
lib_deps = 
#  ESP Async WebServer


[custom_release_ESP32]
extends = ESP32_releases, custom, custom_ESP32
build_flags =
   ${KNX_TP.build_flags}
  ${ESP32_releases.build_flags}
  ${custom.build_flags}
  ${custom_ESP32.build_flags}
  -D OPENKNX_HEARTBEAT
  -D OPENKNX_USB_EXCHANGE_IGNORE
  -D NET_USE_NTP

